[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-mods-mcp"
version = "1.3.0"
description = "Nexus Mods MCP server - 135 tools over REST API v1 + GraphQL API v2"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Talya1412" }]
requires-python = ">=3.10"
keywords = ["mcp", "nexus-mods", "model-context-protocol", "api", "fastmcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/Talya1412/nexus-mcp"
Issues = "https://github.com/Talya1412/nexus-mcp/issues"

[project.scripts]
nexus-mcp = "nexus_mcp.server:main"

[tool.setuptools]
packages = ["nexus_mcp", "nexus_mcp.tools"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
