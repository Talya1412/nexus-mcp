name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          pip install ruff
          ruff check nexus_mcp tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, with dev tools)
        run: pip install -e .[dev]

      - name: Run test suite
        run: pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install -e . pip-audit
          pip-audit

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Wheel smoke test (clean install from wheel)
        run: |
          pip install dist/*.whl
          python -c "
          import asyncio, nexus_mcp
          tools = asyncio.run(nexus_mcp.mcp.list_tools())
          assert len(tools) == nexus_mcp.EXPECTED_TOOLS, f'expected {nexus_mcp.EXPECTED_TOOLS} tools, got {len(tools)}'
          assert len({t.name for t in tools}) == len(tools), 'duplicate tool names'
          assert all(t.description for t in tools), 'tool with empty description'
          print(f'wheel OK: {len(tools)} tools, v{nexus_mcp.__version__}')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  live-smoke:
    needs: [lint, test]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Gate on NEXUS_API_KEY secret
        id: gate
        env:
          KEY: ${{ secrets.NEXUS_API_KEY }}
        run: echo "run=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Live validate-key, REST GET and v2 search (rate-limit aware)
        if: steps.gate.outputs.run == 'true'
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: |
          python -c "
          import asyncio, json
          from nexus_mcp import _core

          async def check():
              v = await _core._api('GET', '/v1/users/validate.json')
              assert 'user_id' in v[0], f'live validate failed: {v[0]}'
              print(f'validate OK: user_id={v[0][\"user_id\"]}')
              g = await _core._api('GET', '/v1/games.json')
              assert isinstance(g[0], list) and g[0], f'live games failed: {str(g[0])[:300]}'
              print(f'games OK: {len(g[0])} games, rl={g[1]}')
              s, _ = await _core._graphql(
                  'query($f: ModsFilter, $c: Int) { mods(filter: $f, count: $c) { totalCount nodes { modId } } }',
                  {'f': {'name': [{'value': 'skyrim', 'op': 'WILDCARD'}]}, 'c': 3},
              )
              assert 'totalCount' in s, f'live v2 search failed: {s}'
              print(f'v2 search OK: total={s[\"totalCount\"]}')
              return True

          assert asyncio.run(check())
          print('live smoke OK')
          "
